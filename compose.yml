x-logging-template: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    pid: host # share host PID namespace so /proc shows host processes for process metrics
    group_add:
      - 984 # host docker group GID, grants access to /var/run/docker.sock for container metrics
    build:
      dockerfile: ./Dockerfile
    <<: *default-logging
    restart: always
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ".env:/app/.env"
      - "./db:/app/db"
    ports:
      - "${K2_EXTERNAL_PORT:-9000}:${K2_PORT:-8000}"
    # deploy:
    #   resources:
    #     limits:
    #       memory: 64M
    #     reservations:
    #       memory: 32M
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:8000/health | grep -q 'ok' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
